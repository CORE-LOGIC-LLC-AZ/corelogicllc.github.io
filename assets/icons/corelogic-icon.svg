<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Core Logic LLC</title>
  <desc id="desc">Geometric CL ligature mark for Core Logic LLC.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6bb8ff" />
      <stop offset="100%" stop-color="#2a83ff" />
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="28" fill="#12141a" />

  <!-- Squared C channel -->
  <path
    fill="#f3f1ec"
    d="M30 26h52v20H50v36h32v20H30V26z"
  />
  <!-- L stem flush with C opening -->
  <path fill="#f3f1ec" d="M82 46h18v54H82z" />
  <!-- Blue L foot -->
  <path fill="url(#accent)" d="M82 80h36v20H82z" />
</svg>
